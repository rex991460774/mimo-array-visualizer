[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimo-array-visualizer"
version = "1.0.0"
description = "Web workbench for editing and evaluating MIMO Tx/Rx antenna array layouts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.26",
]

[project.scripts]
mimo-array-server = "virtual_array.server.cli:main"
mimo-array-case4 = "virtual_array.examples.case4_5tx7rx_sel:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtual_array = [
    "assets/*.png",
    "assets/*.ico",
    "assets/*.icns",
    "server/static/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
