[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimo-array-visualizer"
version = "0.2.0"
description = "Desktop visualizer and evaluator for MIMO Tx/Rx antenna array layouts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
packaging = [
    "pyinstaller>=6.20",
]

[project.scripts]
mimo-array-visualizer = "virtual_array.gui:main"
mimo-array-case4 = "virtual_array.examples.case4_5tx7rx_sel:main"
virtual-array-gui = "virtual_array.gui:main"
virtual-array-case4 = "virtual_array.examples.case4_5tx7rx_sel:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtual_array = [
    "assets/*.png",
    "assets/*.ico",
    "assets/*.icns",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
